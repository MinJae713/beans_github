<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MVPArena · Map Concept Mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin:0; background:#0c0820; color:#f3eee0; font-family:'Outfit', system-ui, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="map-art.jsx"></script>
<script type="text/babel" src="map-variants.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="MVPArena · Map Concept" subtitle="2D side-scroll · environment + tiles only · 4 directions × {game screen, tile library}">
        {['A','B','C','D'].map(letter => {
          const cfg = MV[letter];
          const niceName = cfg.name.split('· ')[1];
          const title = `Variant ${letter} — ${niceName}`;
          return (
            <DCSection key={letter} id={`m${letter}`} title={title} subtitle={cfg.blurb}>
              <DCArtboard id={`m${letter}-screen`} label="Game Screen · S2 · S3 · S4" width={1280} height={720}>
                <MapScreen variant={letter}/>
              </DCArtboard>
              <DCArtboard id={`m${letter}-tiles`} label="Tile Library · 8 Primitives" width={1080} height={600}>
                <MapTiles variant={letter}/>
              </DCArtboard>
            </DCSection>
          );
        })}
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
