services:
  redis:
    image: redis:7-alpine
    container_name: colosseum-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  spring-room-registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum-api
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL_ENABLED: "false"
    ports:
      - "8081:8081"
    restart: unless-stopped
