services:
  spring-room-registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum-api
    environment:
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_SSL_ENABLED: "${REDIS_SSL_ENABLED:-true}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-https://prod-domain.example,https://dev-domain.example}"
    ports:
      - "8081:8081"
    restart: unless-stopped
