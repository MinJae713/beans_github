server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /downloads/Client.zip {
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="Client.zip"' always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /downloads/ {
        try_files $uri =404;
    }
}
