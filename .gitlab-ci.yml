      if [ -z "${PHOTON_APP_VERSION:-}" ]; then
        echo "PHOTON_APP_VERSION is required."
        exit 1
      fi

      if [ ! -x "$UNITY_EDITOR_PATH" ]; then
        echo "Unity Editor executable not found at $UNITY_EDITOR_PATH"
        echo "Set UNITY_EDITOR_PATH to the Unity binary path on the runner host."
        exit 1
      fi

      rm -f "$SIDECAR_PATH" "$SIDECAR_META_PATH"
      trap 'rm -f "$SIDECAR_PATH" "$SIDECAR_META_PATH"' EXIT INT TERM HUP

      cat > "$SIDECAR_PATH" <<EOF
      %YAML 1.1
      %TAG !u! tag:unity3d.com,2011:
      --- !u!114 &11400000
      MonoBehaviour:
        m_ObjectHideFlags: 0
        m_CorrespondingSourceObject: {fileID: 0}
        m_PrefabInstance: {fileID: 0}
        m_PrefabAsset: {fileID: 0}
        m_GameObject: {fileID: 0}
        m_Enabled: 1
        m_EditorHideFlags: 0
        m_Script: {fileID: 1878438611, guid: 7de3b8b9e1263ad479e2d0c4261b7646, type: 3}
        m_Name: PhotonAppSettings.local
        m_EditorClassIdentifier:
        AppSettings:
          AppIdFusion: ${PHOTON_APP_ID_FUSION}
          AppIdChat: ${PHOTON_APP_ID_CHAT:-}
          AppIdVoice: ${PHOTON_APP_ID_VOICE:-}
          AppVersion: ${PHOTON_APP_VERSION}
          UseNameServer: 1
          FixedRegion: ${PHOTON_FIXED_REGION:-}
          Server: ${PHOTON_SERVER:-}
          Port: 0
          ProxyServer:
          Protocol: 0
          EnableProtocolFallback: 1
          AuthMode: 0
          EnableLobbyStatistics: 0
          encryptionMode: 0
          emptyRoomTtl: 0
      EOF

      cat > "$SIDECAR_META_PATH" <<EOF
