        -quit \
        -nographics \
        -projectPath "$CI_PROJECT_DIR/unity" \
        -executeMethod Colosseum.Editor.BuildHelper.BuildClient \
        -logFile "$CLIENT_BUILD_LOG"
      BUILD_EXIT=$?
      tail -n 200 "$CLIENT_BUILD_LOG" || true
      exit $BUILD_EXIT
  artifacts:
    paths:
      - unity/Builds/Client/
      - client-build.log
    expire_in: 1 day

deploy:api:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TARGET == "api" || $TARGET == "all")'
    - if: '$TARGET == "api" || $TARGET == "all"'
      changes:
        - server/**/*
        - infra/remotebuild/APIServer/**/*
  script:
    - 'echo "Starting API deploy to $API_HOST via lobby jump host $LOBBY_HOST"'
    - 'chmod +x server/gradlew'
    - 'chmod 600 "$SSH_LOBBY_KEY"'
    - 'chmod 600 "$SSH_PRIVATE_SUB_KEY"'
    - 'export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64'
    - 'export PATH="$JAVA_HOME/bin:$PATH"'
    - |
      ssh \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_PRIVATE_SUB_KEY" \
        -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $SSH_LOBBY_KEY -W %h:%p $SSH_USER@$LOBBY_HOST" \
        $SSH_USER@$API_HOST \
        "sudo docker stop colosseum-api || true; sudo docker rm colosseum-api || true; rm -f ~/APIServer/server-0.0.1-SNAPSHOT.jar"
    - '(cd server && ./gradlew bootJar)'
    - |
      scp \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_PRIVATE_SUB_KEY" \
        -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $SSH_LOBBY_KEY -W %h:%p $SSH_USER@$LOBBY_HOST" \
        server/build/libs/server-0.0.1-SNAPSHOT.jar \
        $SSH_USER@$API_HOST:/home/ubuntu/APIServer/server-0.0.1-SNAPSHOT.jar
    - |
      ssh \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_PRIVATE_SUB_KEY" \
        -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $SSH_LOBBY_KEY -W %h:%p $SSH_USER@$LOBBY_HOST" \
        $SSH_USER@$API_HOST \
        "cd ~/APIServer && sudo docker compose --env-file .env up -d --build"

deploy:onboarding:
  stage: deploy
  needs:
    - job: build:client-windows
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TARGET == "onboarding" || $TARGET == "all")'
    - if: '$TARGET == "onboarding" || $TARGET == "all"'
      changes:
        - unity/**/*
        - worker-agent/**/*
        - infra/remotebuild/OnboardingPage/**/*
  script:
    - 'echo "Starting Onboarding deploy on local runner host"'
    - 'command -v zip >/dev/null 2>&1 || { echo "zip is required on the runner host."; exit 1; }'
    - 'export ONBOARDING_DIR=/home/gitlab-runner/OnboardingPage'
    - 'mkdir -p "$ONBOARDING_DIR"'
    - |
      if docker ps -a --format '{{.Names}}' | grep -qx 'colosseum-onboarding'; then
        docker stop colosseum-onboarding || true
        docker rm colosseum-onboarding || true
      fi
    - |
      rm -f \
        "$ONBOARDING_DIR/default.conf" \
        "$ONBOARDING_DIR/docker-compose.yml" \
        "$ONBOARDING_DIR/index.html" \
        "$ONBOARDING_DIR/styles.css" \
        "$ONBOARDING_DIR/parallax.js" \
        "$ONBOARDING_DIR/downloads/Client.zip"
    - |
      rm -rf \
        "$ONBOARDING_DIR/assets" \
        "$ONBOARDING_DIR/styles.css" \
        "$ONBOARDING_DIR/parallax.js" \
        "$ONBOARDING_DIR/downloads"
    - |
      mkdir -p "$ONBOARDING_DIR/downloads" && \
      chmod u+rwx "$ONBOARDING_DIR/downloads"
    - |
      cp \
        infra/remotebuild/OnboardingPage/default.conf \
        infra/remotebuild/OnboardingPage/docker-compose.yml \
        infra/remotebuild/OnboardingPage/index.html \
        infra/remotebuild/OnboardingPage/styles.css \
        infra/remotebuild/OnboardingPage/parallax.js \
        "$ONBOARDING_DIR/"
    - |
      cp -r \
        infra/remotebuild/OnboardingPage/assets \
        "$ONBOARDING_DIR/"
    - |
      cp -r \
        unity/Builds/Client \
        "$ONBOARDING_DIR/downloads/"
    - |
      cd "$ONBOARDING_DIR/downloads" && \
      zip -r Client.zip Client
    - |
      cd "$ONBOARDING_DIR" && \
      docker compose up -d

deploy:lobby:
  stage: deploy
  needs:
    - job: build:server-linux
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TARGET == "lobby" || $TARGET == "all")'
    - if: '$TARGET == "lobby" || $TARGET == "all"'
      changes:
        - unity/**/*
        - worker-agent/**/*
        - infra/remotebuild/**/*
  script:
    - 'echo "Starting Lobby deploy to $LOBBY_HOST"'
    - 'chmod 600 "$SSH_LOBBY_KEY"'
    - |
      ssh \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_LOBBY_KEY" \
        $SSH_USER@$LOBBY_HOST \
        '
          if [ -f ~/lobby.pid ]; then
            kill "$(cat ~/lobby.pid)" 2>/dev/null || true
            rm -f ~/lobby.pid
          fi
          rm -rf ~/LobbyServer/Server-Linux
          rm -f ~/lobby.log ~/lobby.out
          mkdir -p ~/LobbyServer
        '
    - |
      scp \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_LOBBY_KEY" \
        -r unity/Builds/Server-Linux \
        $SSH_USER@$LOBBY_HOST:/home/ubuntu/LobbyServer/
    - |
      ssh \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_LOBBY_KEY" \
        $SSH_USER@$LOBBY_HOST \
        "
          cd /home/ubuntu/LobbyServer/Server-Linux
          chmod +x Colosseum-Server
          nohup env \
            COLOSSEUM_WORKER_BASE_URL='$COLOSSEUM_WORKER_BASE_URL' \
            COLOSSEUM_ROOM_API_BASE_URL='$COLOSSEUM_ROOM_API_BASE_URL' \
            ./Colosseum-Server --mode lobby -logFile /home/ubuntu/lobby.log > /home/ubuntu/lobby.out 2>&1 &
          echo \$! > /home/ubuntu/lobby.pid
        "

deploy:worker:
  stage: deploy
  needs:
    - job: build:server-linux
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TARGET == "worker" || $TARGET == "all")'
    - if: '$TARGET == "worker" || $TARGET == "all"'
      changes:
        - unity/**/*
        - worker-agent/**/*
        - infra/remotebuild/WorkerServer/**/*
  script:
    - 'echo "Starting Worker deploy to $WORKER_HOST via lobby jump host $LOBBY_HOST"'
    - 'chmod 600 "$SSH_LOBBY_KEY"'
    - 'chmod 600 "$SSH_PRIVATE_SUB_KEY"'
    - |
      ssh \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_PRIVATE_SUB_KEY" \
        -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $SSH_LOBBY_KEY -W %h:%p $SSH_USER@$LOBBY_HOST" \
        $SSH_USER@$WORKER_HOST \
        'bash -lc '"'"'
          pkill -f 'Colosseum-Server.*--mode game' || true
          sudo docker stop colosseum-worker-agent || true
          sudo docker rm colosseum-worker-agent || true
          rm -f \
            ~/WorkerServer/Dockerfile \
            ~/WorkerServer/docker-compose.yml
          rm -rf \
            ~/WorkerServer/Server-Linux \
            ~/worker-agent
          mkdir -p ~/WorkerServer
        '"'"''
    - |
      scp \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_PRIVATE_SUB_KEY" \
        -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $SSH_LOBBY_KEY -W %h:%p $SSH_USER@$LOBBY_HOST" \
        -r worker-agent \
        $SSH_USER@$WORKER_HOST:/home/ubuntu/
    - |
      scp \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_PRIVATE_SUB_KEY" \
        -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $SSH_LOBBY_KEY -W %h:%p $SSH_USER@$LOBBY_HOST" \
        -r unity/Builds/Server-Linux \
        $SSH_USER@$WORKER_HOST:/home/ubuntu/WorkerServer/
    - |
      scp \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_PRIVATE_SUB_KEY" \
        -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $SSH_LOBBY_KEY -W %h:%p $SSH_USER@$LOBBY_HOST" \
        infra/remotebuild/WorkerServer/Dockerfile \
        infra/remotebuild/WorkerServer/docker-compose.yml \
        $SSH_USER@$WORKER_HOST:/home/ubuntu/WorkerServer/
    - |
      ssh \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        -i "$SSH_PRIVATE_SUB_KEY" \
        -o "ProxyCommand=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $SSH_LOBBY_KEY -W %h:%p $SSH_USER@$LOBBY_HOST" \
        $SSH_USER@$WORKER_HOST \
        "chmod +x ~/WorkerServer/Server-Linux/Colosseum-Server && cd ~/WorkerServer && sudo docker compose --env-file .env up -d --build"
