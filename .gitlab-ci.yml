stages:
  - validate
  - build
  - deploy

default:
  tags:
    - colosseum-deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

validate:runner:
  stage: validate
  script:
    - 'echo "Runner is connected"'
    - 'echo "Project: $CI_PROJECT_PATH"'
    - 'echo "Branch: $CI_COMMIT_REF_NAME"'
    - 'echo "Pipeline source: $CI_PIPELINE_SOURCE"'
    - 'echo "TARGET: $TARGET"'
    - 'echo "API_HOST: $API_HOST"'
    - 'echo "LOBBY_HOST: $LOBBY_HOST"'
    - 'echo "ONBOARDING_HOST: $ONBOARDING_HOST"'
    - 'echo "WORKER_HOST: $WORKER_HOST"'

build:server-linux:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TARGET == "worker" || $TARGET == "lobby" || $TARGET == "all")'
    - if: '$TARGET == "worker" || $TARGET == "lobby" || $TARGET == "all"'
      changes:
        - unity/**/*
        - worker-agent/**/*
        - infra/remotebuild/**/*
  script:
    - 'echo "Building Unity Linux Dedicated Server artifact"'
    - 'git lfs version >/dev/null 2>&1 || { echo "git-lfs is required on the runner host."; exit 1; }'
    - 'git lfs pull'
    - |
      export UNITY_EDITOR_PATH="${UNITY_EDITOR_PATH:-/opt/unity/Editor/Unity}"
      export SIDECAR_PATH="$CI_PROJECT_DIR/unity/Assets/Photon/Fusion/Resources/PhotonAppSettings.local.asset"
      export SIDECAR_META_PATH="$CI_PROJECT_DIR/unity/Assets/Photon/Fusion/Resources/PhotonAppSettings.local.asset.meta"
      export SERVER_BUILD_LOG="$CI_PROJECT_DIR/server-build.log"

      if [ -z "${PHOTON_APP_ID_FUSION:-}" ]; then
        echo "PHOTON_APP_ID_FUSION is required."
        exit 1
      fi

      if [ -z "${PHOTON_APP_VERSION:-}" ]; then
        echo "PHOTON_APP_VERSION is required."
        exit 1
      fi

      if [ ! -x "$UNITY_EDITOR_PATH" ]; then
        echo "Unity Editor executable not found at $UNITY_EDITOR_PATH"
        echo "Set UNITY_EDITOR_PATH to the Unity binary path on the runner host."
        exit 1
      fi

      rm -f "$SIDECAR_PATH" "$SIDECAR_META_PATH"
      trap 'rm -f "$SIDECAR_PATH" "$SIDECAR_META_PATH"' EXIT INT TERM HUP

      cat > "$SIDECAR_PATH" <<EOF
      %YAML 1.1
      %TAG !u! tag:unity3d.com,2011:
      --- !u!114 &11400000
      MonoBehaviour:
        m_ObjectHideFlags: 0
        m_CorrespondingSourceObject: {fileID: 0}
        m_PrefabInstance: {fileID: 0}
        m_PrefabAsset: {fileID: 0}
        m_GameObject: {fileID: 0}
        m_Enabled: 1
        m_EditorHideFlags: 0
        m_Script: {fileID: 1878438611, guid: 7de3b8b9e1263ad479e2d0c4261b7646, type: 3}
        m_Name: PhotonAppSettings.local
        m_EditorClassIdentifier:
        AppSettings:
          AppIdFusion: ${PHOTON_APP_ID_FUSION}
          AppIdChat: ${PHOTON_APP_ID_CHAT:-}
          AppIdVoice: ${PHOTON_APP_ID_VOICE:-}
          AppVersion: ${PHOTON_APP_VERSION}
          UseNameServer: 1
          FixedRegion: ${PHOTON_FIXED_REGION:-}
          Server: ${PHOTON_SERVER:-}
          Port: 0
          ProxyServer:
          Protocol: 0
          EnableProtocolFallback: 1
          AuthMode: 0
          EnableLobbyStatistics: 0
          encryptionMode: 0
          emptyRoomTtl: 0
      EOF

      cat > "$SIDECAR_META_PATH" <<EOF
      fileFormatVersion: 2
      guid: 4fd56fc2fbe94e0eb6be5d2a4cb43ce1
      NativeFormatImporter:
        externalObjects: {}
        mainObjectFileID: 11400000
        userData:
        assetBundleName:
        assetBundleVariant:
      EOF

      "$UNITY_EDITOR_PATH" \
        -batchmode \
        -quit \
        -nographics \
        -projectPath "$CI_PROJECT_DIR/unity" \
        -executeMethod Colosseum.Editor.BuildHelper.BuildServerLinux \
        -logFile "$SERVER_BUILD_LOG"
      BUILD_EXIT=$?
      tail -n 200 "$SERVER_BUILD_LOG" || true
      exit $BUILD_EXIT
  artifacts:
    paths:
      - unity/Builds/Server-Linux/
      - server-build.log
    expire_in: 1 day

